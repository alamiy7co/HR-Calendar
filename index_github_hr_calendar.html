<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alamiya HR Calendar</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>

  <style>
    :root{
      --green:#006b4f;--green2:#004b38;--green3:#0a8f6a;--gold:#c99a2e;
      --bg:#f4f8f6;--card:#fff;--text:#12211d;--muted:#6b7b76;--line:#e3ece8;
      --shadow:0 24px 65px rgba(0,44,32,.11);
      --blue:#1d73d8;--emp:#0f9d69;--red:#dc2626;--purple:#7c3aed;--orange:#f59e0b;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);background:
      radial-gradient(circle at 90% 0%,rgba(0,107,79,.16),transparent 30%),
      radial-gradient(circle at 8% 100%,rgba(201,154,46,.14),transparent 25%),
      linear-gradient(135deg,#fbfdfc,#edf6f2);}
    .app{min-height:100vh;display:grid;grid-template-columns:340px 1fr;gap:22px;padding:22px}
    .sidebar,.main-card{background:rgba(255,255,255,.90);border:1px solid rgba(227,236,232,.95);border-radius:32px;box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden}
    .sidebar{height:calc(100vh - 44px);position:sticky;top:22px;padding:22px;overflow:auto}
    .brand{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .mark{width:58px;height:58px;border:11px solid var(--green);border-radius:50%;box-shadow:0 12px 24px rgba(0,107,79,.18);position:relative;background:#fff;flex:none}
    .mark:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(201,154,46,.45)}
    .wordmark{direction:ltr;text-align:left;line-height:.95}.wordmark .small{font-size:13px;font-weight:800;color:var(--green2)}.wordmark .big{font-size:31px;font-weight:950;color:var(--green);letter-spacing:-1px}.wordmark .foot{font-size:12px;font-weight:900;letter-spacing:3px;color:var(--green2)}
    .pill{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:8px 12px;border-radius:999px;background:rgba(0,107,79,.08);color:var(--green2);font-weight:900;font-size:12px}.pill:before{content:"";width:8px;height:8px;background:var(--gold);border-radius:50%}
    .section-title{margin:22px 0 10px;color:var(--muted);font-size:13px;font-weight:900}
    .search{width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px 15px;outline:none;font-size:14px}.search:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(0,107,79,.08)}
    .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;padding:13px;border:1px solid var(--line);border-radius:19px;background:#fff;transition:.2s}.toggle:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,44,32,.06)}.toggle span{display:flex;align-items:center;gap:10px;font-weight:900}.dot{width:12px;height:12px;border-radius:50%;display:inline-block}.toggle input{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:linear-gradient(180deg,#fff,#f8fbfa);border:1px solid var(--line);border-radius:22px;padding:16px}.stat b{display:block;font-size:28px;color:var(--green2);margin-bottom:4px}.stat small{color:var(--muted);font-weight:800}
    .upcoming{display:flex;flex-direction:column;gap:9px}.up-item{border:1px solid var(--line);background:#fff;border-radius:17px;padding:11px}.up-item b{display:block;font-size:13px}.up-item small{color:var(--muted);font-weight:800}
    .refresh{width:100%;border:0;border-radius:17px;padding:13px;background:var(--green2);color:#fff;font-weight:900;cursor:pointer;margin-top:12px}
    .main-card{min-width:0}.hero{padding:24px 28px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;display:flex;justify-content:space-between;align-items:center;gap:18px}.hero h1{margin:0;font-size:29px}.hero p{margin:7px 0 0;color:rgba(255,255,255,.80)}.hero .mini-brand{display:flex;align-items:center;gap:12px;direction:ltr}.mini-brand .mark{width:48px;height:48px;border-width:9px;background:transparent;box-shadow:none}.mini-brand .big{color:#fff;font-size:25px}.mini-brand .small,.mini-brand .foot{color:rgba(255,255,255,.84)}
    .calendar-wrap{padding:22px}#calendar{direction:rtl}.fc{--fc-border-color:#e8efec;--fc-today-bg-color:rgba(0,107,79,.08)}.fc .fc-toolbar-title{font-size:26px;font-weight:950;color:var(--green2)}.fc .fc-button{border:0!important;border-radius:14px!important;background:var(--green2)!important;padding:9px 14px!important;font-weight:900!important}.fc .fc-button-primary:not(:disabled).fc-button-active{background:var(--green)!important}.fc-col-header-cell{background:#f3faf7;padding:9px 0}.fc-daygrid-day-number{font-weight:900;color:#20342e}.fc-event{border:0!important;border-radius:10px!important;padding:4px 7px!important;font-size:12px!important;box-shadow:0 8px 16px rgba(0,0,0,.08);cursor:pointer}.fc-day-today .fc-daygrid-day-number{background:var(--green);color:#fff;border-radius:999px;padding:4px 9px}
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(9,23,18,.50);z-index:50;align-items:center;justify-content:center;padding:20px}.modal{width:min(620px,100%);max-height:82vh;overflow:auto;background:#fff;border-radius:28px;box-shadow:0 24px 70px rgba(0,0,0,.22);padding:24px}.modal h2{margin:0 0 14px;color:var(--green2)}.info-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.info-row label{color:var(--muted);font-weight:950}.close-btn{margin-top:20px;width:100%;border:0;border-radius:17px;padding:14px;background:var(--green2);color:#fff;font-weight:950;cursor:pointer}
    .status{font-size:12px;color:var(--muted);font-weight:800;margin-top:10px}
    @media(max-width:950px){.app{grid-template-columns:1fr;padding:12px}.sidebar{height:auto;position:static}.hero{flex-direction:column;align-items:flex-start}.fc .fc-toolbar{flex-direction:column;gap:10px}.calendar-wrap{padding:12px}.info-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand"><div class="mark"></div><div class="wordmark"><div class="small">Alressoom</div><div class="big">Alamiya</div><div class="foot">FURNITURE</div></div></div>
      <div class="pill">HR Calendar System</div>
      <div class="section-title">بحث سريع</div>
      <input id="searchInput" class="search" placeholder="ابحث عن موظف، قسم، ملاحظة..." />
      <button class="refresh" onclick="loadEvents()">تحديث البيانات</button>
      <div id="loadStatus" class="status">جاهز للتحميل</div>
      <div class="section-title">أنواع الأحداث</div>
      <div id="filters"></div>
      <div class="section-title">ملخص</div>
      <div class="stats"><div class="stat"><b id="totalEvents">0</b><small>إجمالي الأحداث</small></div><div class="stat"><b id="todayEvents">0</b><small>أحداث اليوم</small></div></div>
      <div class="section-title">الأحداث القادمة</div>
      <div id="upcomingList" class="upcoming"></div>
    </aside>
    <section class="main-card">
      <header class="hero"><div><h1>تقويم الموارد البشرية</h1><p>إدارة المتابعات، المناسبات، والتقييمات من Google Sheets بشكل مباشر</p></div><div class="mini-brand"><div class="mark"></div><div class="wordmark"><div class="small">Alressoom</div><div class="big">Alamiya</div><div class="foot">FURNITURE</div></div></div></header>
      <div class="calendar-wrap"><div id="calendar"></div></div>
    </section>
  </main>
  <div id="modalBackdrop" class="modal-backdrop"><div class="modal"><h2 id="modalTitle"></h2><div id="modalContent"></div><button class="close-btn" onclick="closeModal()">إغلاق</button></div></div>

  <script>
    /*************** ضع هنا رابط Web App من Apps Script ***************/
const API_URL = 'https://script.google.com/macros/s/AKfycbzSmb2dadTrqSWWlZ2KqW_F_QSeKsXOvvh4b1-folsMdK-ZCmhavfeX21Y12XbFefxK/exec';
    /******************************************************************/

    let calendar;
    let allEvents = [];
    const TYPE_COLORS = {
      'متابعات': '#1d73d8',
      'مناسبات الموظفين': '#0f9d69',
      'مناسبات عامة': '#dc2626',
      'التقييمات': '#7c3aed'
    };
    const FALLBACK_COLORS = ['#1d73d8','#0f9d69','#dc2626','#7c3aed','#f59e0b','#0891b2','#be185d','#475569'];

    document.addEventListener('DOMContentLoaded', () => {
      calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        locale:'ar', direction:'rtl', initialView:'dayGridMonth', height:'auto',
        headerToolbar:{right:'prev,next today',center:'title',left:'dayGridMonth,timeGridWeek,listMonth'},
        buttonText:{today:'اليوم',month:'شهر',week:'أسبوع',list:'قائمة'},
        events:[], eventClick:(info)=>showEventDetails(info.event)
      });
      calendar.render();
      document.getElementById('searchInput').addEventListener('input', applyFilters);
      loadEvents();
    });

    function loadEvents(){
      setStatus('جاري تحميل البيانات...');
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(events=>handleLoadedEvents(events || []))
          .withFailureHandler(err=>setStatus('تعذر تحميل البيانات: ' + err.message)).getCalendarEvents();
        return;
      }
      if (!API_URL || API_URL.includes('PUT_YOUR')) {
        setStatus('ضع رابط Apps Script Web App داخل API_URL أولاً.');
        handleLoadedEvents([]);
        return;
      }
      loadJsonp(API_URL, data => {
        const events = Array.isArray(data) ? data : (data && data.events ? data.events : []);
        handleLoadedEvents(events);
      }, err => {
        setStatus('تعذر الاتصال بالشيت. تأكد من رابط API_URL والصلاحيات.');
        console.error(err);
        handleLoadedEvents([]);
      });
    }

    function loadJsonp(url, onSuccess, onError){
      const callbackName = 'hrCalendarCallback_' + Date.now();
      const script = document.createElement('script');
      const sep = url.includes('?') ? '&' : '?';
      script.src = `${url}${sep}action=events&callback=${callbackName}`;
      script.onerror = () => { cleanup(); onError(new Error('JSONP failed')); };
      window[callbackName] = data => { cleanup(); onSuccess(data); };
      function cleanup(){ delete window[callbackName]; script.remove(); }
      document.body.appendChild(script);
    }

    function handleLoadedEvents(events){
      allEvents = normalizeEvents(events);
      buildFilters(allEvents);
      applyFilters();
      setStatus(`تم تحميل ${allEvents.length} حدث`);
    }

    function normalizeEvents(events){
      return (events || []).filter(e => e && e.start).map((e, i) => {
        const p = e.extendedProps || {};
        const type = p.type || e.type || p.sheet || 'أحداث أخرى';
        const color = e.backgroundColor || e.color || TYPE_COLORS[type] || FALLBACK_COLORS[i % FALLBACK_COLORS.length];
        return {
          ...e,
          title: e.title || p.employee || 'حدث بدون عنوان',
          backgroundColor: color,
          borderColor: color,
          extendedProps: {...p, type}
        };
      });
    }

    function buildFilters(events){
      const container = document.getElementById('filters');
      const types = [...new Set(events.map(e => e.extendedProps?.type || 'أحداث أخرى'))];
      if (!types.length) { container.innerHTML = '<div class="status">لا توجد أنواع أحداث محملة حالياً</div>'; return; }
      container.innerHTML = types.map((type, i) => {
        const color = TYPE_COLORS[type] || FALLBACK_COLORS[i % FALLBACK_COLORS.length];
        return `<label class="toggle"><span><i class="dot" style="background:${color}"></i>${escapeHtml(type)}</span><input class="type-filter" type="checkbox" value="${escapeHtml(type)}" checked></label>`;
      }).join('');
      document.querySelectorAll('.type-filter').forEach(cb=>cb.addEventListener('change', applyFilters));
    }

    function applyFilters(){
      const checked = [...document.querySelectorAll('.type-filter:checked')].map(x=>x.value);
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allEvents.filter(e => {
        const p = e.extendedProps || {};
        const matchesType = !checked.length ? false : checked.includes(p.type);
        const text = [e.title, ...Object.values(p)].join(' ').toLowerCase();
        return matchesType && (!search || text.includes(search));
      });
      calendar.removeAllEvents();
      calendar.addEventSource(filtered);
      updateStats(filtered);
      updateUpcoming(filtered);
    }

    function updateStats(events){
      const today = new Date().toISOString().slice(0,10);
      document.getElementById('totalEvents').textContent = events.length;
      document.getElementById('todayEvents').textContent = events.filter(e => String(e.start).slice(0,10) === today).length;
    }

    function updateUpcoming(events){
      const today = new Date().toISOString().slice(0,10);
      const upcoming = events.filter(e => String(e.start).slice(0,10) >= today)
        .sort((a,b)=>String(a.start).localeCompare(String(b.start))).slice(0,8);
      const box = document.getElementById('upcomingList');
      box.innerHTML = upcoming.length ? upcoming.map(e => {
        const p = e.extendedProps || {};
        return `<div class="up-item"><b>${escapeHtml(e.title)}</b><small>${escapeHtml(String(e.start).slice(0,10))} · ${escapeHtml(p.type || '')}</small></div>`;
      }).join('') : '<div class="status">لا توجد أحداث قادمة حسب الفلاتر الحالية</div>';
    }

    function showEventDetails(event){
      const p = event.extendedProps || {};
      document.getElementById('modalTitle').textContent = event.title;
      const baseRows = [['التصنيف', p.type], ['التاريخ', event.startStr || event.start], ['الشيت', p.sheet]];
      const propRows = Object.entries(p).filter(([k,v]) => v && !['type','sheet'].includes(k)).map(([k,v]) => [labelOf(k), v]);
      const rows = [...baseRows, ...propRows].filter(r => r[1]);
      document.getElementById('modalContent').innerHTML = rows.map(([k,v]) => `<div class="info-row"><label>${escapeHtml(k)}</label><div>${escapeHtml(String(v))}</div></div>`).join('');
      document.getElementById('modalBackdrop').style.display='flex';
    }

    function labelOf(key){
      const labels = {
        employee:'الموظف', department:'القسم', position:'المنصب', action:'الإجراء', description:'الوصف', note:'الملاحظة', add:'الإضافة', rowNumber:'رقم الصف',
        nextEvaluation:'التقييم التالي', nextEvaluationDate:'تاريخ التقييم التالي', firstEvaluationDate:'التقييم الأول', secondEvaluationDate:'التقييم الثاني', thirdEvaluationDate:'التقييم الثالث',
        finalStatus:'الحالة النهائية', anniversary:'الذكرى السنوية', startDate:'تاريخ المباشرة'
      };
      return labels[key] || key;
    }

    function closeModal(){document.getElementById('modalBackdrop').style.display='none'}
    function setStatus(msg){document.getElementById('loadStatus').textContent = msg;}
    function escapeHtml(text){return String(text).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[ch]));}
  </script>
</body>
</html>
